[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-api"
version = "0.1.0"
description = "Independent Task Management REST API for Day 29"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
src = ["."]